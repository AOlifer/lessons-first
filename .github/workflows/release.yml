name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Read version from tag (cross-check with csproj)
        id: ver
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $csprojVersion = (Select-Xml -Path "src/LessonsFirst.App/LessonsFirst.App.csproj" -XPath "//Version").Node.InnerText
          if ($tagVersion -ne $csprojVersion) {
            Write-Error "Tag v$tagVersion != csproj version $csprojVersion"; exit 1
          }
          "version=$csprojVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing version $csprojVersion"

      - name: Publish single-file exe
        run: >
          dotnet publish src/LessonsFirst.App/LessonsFirst.App.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe не найден" }
          & $iscc "/DVersion=${{ steps.ver.outputs.version }}" "installer\lessons-first.iss"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: "Сначала уроки! v${{ steps.ver.outputs.version }}"
          generate_release_notes: true
          files: |
            publish/LessonsFirst.exe
            installer-output/LessonsFirst-Setup.exe
            lessons-first-brand/promo/lessons-first-promo.png
